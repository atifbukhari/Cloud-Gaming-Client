name: Demo Client APK

on:
  push:
    branches:
      - demo-client-v1
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install required Android components
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "ndk;29.0.14206865"

      - name: Build demo APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleNonRootDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cloud-gaming-demo-apk
          path: app/build/outputs/apk/nonRoot/debug/*.apk
          retention-days: 7
